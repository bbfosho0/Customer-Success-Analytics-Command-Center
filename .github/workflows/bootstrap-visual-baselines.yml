name: Bootstrap visual baselines

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: visual-baseline-bootstrap-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  baselines:
    if: github.event.pull_request.head.ref == 'storybook-playwright-redesign-foundation'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate Chromium visual baselines
        run: npm run test:visual:update
      - name: Commit generated visual baselines and remove bootstrap workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/visual/__screenshots__
          git rm .github/workflows/bootstrap-visual-baselines.yml
          git commit -m "test: capture visual regression baselines"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
