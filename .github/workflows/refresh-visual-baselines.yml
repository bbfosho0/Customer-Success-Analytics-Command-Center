name: Refresh visual baselines

on:
  push:
    branches: [storybook-playwright-redesign-foundation]

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: storybook-playwright-redesign-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh MSW-backed Chromium snapshots
        run: npx playwright test tests/visual --update-snapshots
      - name: Commit refreshed snapshots and remove one-time workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-visual-baselines.yml
          git add frontend/tests/visual/__screenshots__
          git status --short
          git commit -m "test: refresh MSW visual baselines"
          git push origin HEAD:storybook-playwright-redesign-foundation
