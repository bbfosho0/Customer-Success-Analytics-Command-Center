name: CI

on:
  pull_request:
  push:
    branches: [main, local-first-approach]

jobs:
  backend:
    name: Backend tests and OpenAPI export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r backend/requirements.txt
      - name: Generate local ETL artifacts
        run: python scripts/generate_parquet.py --input data/sample_calls.json --agents data/agents.csv --output data/cleaned_calls.parquet
      - name: Run Python tests
        run: python -m pytest tests backend/app/tests
      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py --output openapi.json
      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi.json

  frontend:
    name: Frontend lint, test, build, and schema drift
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download OpenAPI schema
        uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: .
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Check generated OpenAPI types for drift
        run: npm --prefix frontend run api:check
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Test frontend
        run: npm --prefix frontend run test
      - name: Build frontend static export
        run: npm --prefix frontend run build
