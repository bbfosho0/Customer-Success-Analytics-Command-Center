name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap_storybook_browser_assets:
    name: Bootstrap Storybook browser test assets
    if: github.event_name == 'pull_request' && github.head_ref == 'storybook-playwright-redesign-foundation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install current frontend dependencies
        run: npm --prefix frontend ci
      - name: Add Vitest Playwright browser provider
        working-directory: frontend
        run: npm install --save-dev @vitest/browser-playwright@4.0.14
      - name: Generate MSW service worker
        working-directory: frontend
        run: npx msw init ./public --save
      - name: Commit generated browser test assets
        shell: bash
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json frontend/public/mockServiceWorker.js; then
            echo "No generated browser test asset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json frontend/public/mockServiceWorker.js
          git commit -m "chore: add Storybook browser test assets"
          git fetch origin storybook-playwright-redesign-foundation
          git rebase origin/storybook-playwright-redesign-foundation
          git push origin HEAD:storybook-playwright-redesign-foundation

  backend:
    name: Backend tests and OpenAPI export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r backend/requirements.txt
      - name: Generate local ETL artifacts
        run: |
          python scripts/generate_parquet.py --input data/sample_calls.json --agents data/agents.csv --output data/cleaned_calls.parquet
          python scripts/generate_customer_analytics.py
          python scripts/export_salesforce_crma.py
      - name: Run Python tests
        run: python -m pytest tests backend/app/tests
      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py --output openapi.json
      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: openapi.json

  frontend:
    name: Frontend lint, test, build, and schema drift
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download OpenAPI schema
        uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: .
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Check generated OpenAPI types for drift
        run: npm --prefix frontend run api:check
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Test frontend
        run: npm --prefix frontend run test
      - name: Build frontend static export
        run: npm --prefix frontend run build
        env:
          GITHUB_PAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
      - name: Build Storybook
        run: npm --prefix frontend run storybook:build
      - name: Publish static export to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_gh_pages.py --message "Deploy static export from ${GITHUB_SHA}"

  salesforce:
    name: Salesforce metadata and sample-data tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: salesforce/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install Salesforce QA dependencies
        run: npm --prefix salesforce ci
      - name: Verify Playwright dependency
        run: npm --prefix salesforce run playwright:version
      - name: Run Salesforce source tests
        run: python -m pytest salesforce/tests
