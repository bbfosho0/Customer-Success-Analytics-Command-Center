name: Bootstrap visual tooling

on:
  push:
    branches: [storybook-playwright-redesign-foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: storybook-playwright-redesign-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install current frontend dependencies
        run: npm --prefix frontend ci

      - name: Verify current frontend tests
        run: npm --prefix frontend run test

      - name: Verify current frontend build
        run: npm --prefix frontend run build

      - name: Install Storybook MSW and Playwright tooling
        working-directory: frontend
        run: |
          npm install --save-dev \
            storybook@latest \
            @storybook/nextjs-vite@latest \
            @storybook/addon-a11y@latest \
            @storybook/addon-vitest@latest \
            @storybook/addon-mcp@latest \
            @storybook/addon-docs@latest \
            msw@^2 \
            msw-storybook-addon@latest \
            @playwright/test@latest \
            @playwright/cli@latest
          npm pkg set scripts.storybook="storybook dev -p 6006"
          npm pkg set scripts.storybook:build="storybook build"
          npm pkg set scripts.storybook:test="vitest --project=storybook --run"
          npm pkg set scripts.playwright:version="playwright --version"
          npm pkg set scripts.playwright:cli:version="playwright-cli --version"
          npm pkg set scripts.test:e2e="playwright test tests/e2e"
          npm pkg set scripts.test:visual="playwright test tests/visual"
          npm pkg set scripts.test:visual:update="playwright test tests/visual --update-snapshots"

      - name: Extend generated output ignores
        shell: bash
        run: |
          for pattern in \
            'frontend/storybook-static/' \
            'frontend/playwright-report/' \
            'frontend/test-results/' \
            'frontend/visual-evidence/' \
            'frontend/.playwright-cli/'
          do
            grep -Fxq "$pattern" .gitignore || echo "$pattern" >> .gitignore
          done

      - name: Verify Playwright entrypoints
        run: |
          npm --prefix frontend run playwright:version
          npm --prefix frontend run playwright:cli:version

      - name: Re-run frontend tests
        run: npm --prefix frontend run test

      - name: Re-run frontend build
        run: npm --prefix frontend run build

      - name: Commit generated dependency lock
        shell: bash
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json .gitignore; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json .gitignore
          git commit -m "chore: add Storybook MSW and Playwright tooling"
          git push origin HEAD:storybook-playwright-redesign-foundation
